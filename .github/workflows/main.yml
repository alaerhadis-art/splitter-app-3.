name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install latest build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            pkg-config \
            libtool \
            libtool-bin \
            libffi-dev \
            libssl-dev \
            zlib1g-dev
          # 关键修复：更新 libtool 宏
          sudo libtoolize --force --copy
      
      - name: Cache buildozer
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython
      
      - name: Build APK
        run: buildozer android debug --verbose
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./bin/*.apk
